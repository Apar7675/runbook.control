name: RunBook Control CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runbook-control-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Static authorization checks
        run: npm run test:f03:authorization

      - name: Software update policy and route regressions
        run: node scripts/verify-software-update-policy.js

      - name: Desktop access boundary route regressions
        run: npm run test:desktop-access

      - name: Authorized shop directory and company scope regressions
        run: npm run test:company-scope

      - name: Control MFA step-up and return regressions
        run: node scripts/verify-control-mfa-stepup.js

      - name: Control authenticator enrollment regressions
        run: node scripts/verify-control-mfa-enrollment.js

      - name: Control MFA captured session and cookie publication regressions
        run: node scripts/verify-control-mfa-session.js

  timeclock-summary-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      timeclockdb:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: runbook_timeclock_test
        options: >-
          --health-cmd "pg_isready -U postgres -d runbook_timeclock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Weekly timeclock SQL and RLS regressions
        shell: bash
        run: |
          set -euo pipefail
          cat supabase/tests/timeclock_weekly_summary_fixture.sql \
            supabase/migrations/20261023235500_timeclock_weekly_summary_utc.sql \
            supabase/tests/timeclock_weekly_summary.sql |
            docker exec -i '${{ job.services.timeclockdb.id }}' \
              psql -U postgres -d runbook_timeclock_test --no-psqlrc --set ON_ERROR_STOP=on
