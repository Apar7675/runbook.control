name: RunBook Control CI

on:
  push:
    branches:
      - feature/business-suite-redo-20261004
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runbook-control-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Static authorization checks
        run: npm run test:f03:authorization
